---
# ejemplo para clientes con su propio namespace
kind: Namespace
apiVersion: v1
metadata:
  name:  suinsit-nova
---
# rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: suinsit-app-sa
  namespace: suinsit-nova
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: suinsit-nova
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets","endpoints","services"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configmap-reader-binding
  namespace: suinsit-nova
subjects:
- kind: ServiceAccount
  name: suinsit-app-sa
roleRef:
  kind: Role
  name: configmap-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configmap-reader-binding
  namespace: suinsit-nova
subjects:
- kind: ServiceAccount
  name: suinsit-app-sa
  namespace: suinsit-nova
roleRef:
  kind: Role
  name: configmap-reader
  apiGroup: rbac.authorization.k8s.io 
---
    kind: PersistentVolumeClaim
    apiVersion: v1
    metadata:
      name: pvc-suinsit
      namespace:  suinsit-nova
    spec:
      storageClassName: "nfs"
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 5Gi  
