version: '3.8'

services:
  # ============================================
  # MICROSERVICIOS EXISTENTES (PROMPTS_01)
  # ============================================
  
  leka-bias-detection-service:
    build:
      context: /mnt/c/Users/ManuelGonzalez/git/leka-bias-detection-service
      dockerfile: Dockerfile
    container_name: leka-bias-detection-service
    ports:
      - "8001:8001"
    environment:
      - LOG_LEVEL=INFO
      - MAX_FILE_SIZE_MB=1024
      - BASE_TIMEOUT_SECONDS=30
      - TIMEOUT_PER_MB=0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-governance-network
    labels:
      - "service=bias-detection"
      - "compliance=true"
      - "port=8001"

